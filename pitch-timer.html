<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Offline count-up timer for controlling pitch sessions.">
  <title>Athenen ajastin</title>
  <!-- Empty favicon: avoids a failed favicon request when opened from disk. -->
  <link rel="icon" href="data:,">

  <style>
    /* ======================================================================
       Design tokens — palette and type taken from athene.fi
       ====================================================================== */
    :root {
      --athene-green: #5e8c64;
      --athene-paper: #f5f5f5;
      --athene-ink: #333333;
      /* Darker shade of the Athene green for small text on paper (5.2:1, WCAG AA). */
      --athene-green-deep: #4a7050;
      /* Not on athene.fi: alert colour for "time's up" (4.8:1 against paper). */
      --alert-red: #b8463d;

      --font-display: "Open Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-body: "Gentium Book Basic", Georgia, "Times New Roman", serif;

      --radius: 4px;
      --tracking: 0.05em;
      --speed: 0.3s;

      /* Stage colours. Switched by data-zone on <body>. */
      --stage-bg: var(--athene-green);
      --stage-fg: var(--athene-paper);
    }

    /* Wrap-up warning: invert, like the hover state of the athene.fi navigation. */
    body[data-zone="warning"] {
      --stage-bg: var(--athene-paper);
      --stage-fg: var(--athene-green);
    }

    body[data-zone="over"] {
      --stage-bg: var(--alert-red);
      --stage-fg: var(--athene-paper);
    }

    /* ======================================================================
       Base
       ====================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--stage-bg);
      color: var(--stage-fg);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.5;
      overflow-wrap: break-word;
      transition: background-color var(--speed), color var(--speed);
    }

    button,
    input {
      font: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--athene-green-deep);
      outline-offset: 3px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* ======================================================================
       Header — mirrors the athene.fi site header
       ====================================================================== */
    .site-header {
      padding: 1.5rem 1.25rem 0;
      text-align: center;
    }

    .site-header__title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(2.5rem, 7vw, 5rem);
      font-weight: 800;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .site-header__rule {
      width: min(600px, 100%);
      margin: 1.25rem auto 0;
      border: 0;
      border-top: 1px solid currentColor;
    }

    /* ======================================================================
       Layout: timer stage on top, settings panel below it at every width
       ====================================================================== */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 3rem;
      width: min(1200px, 100%);
      margin-inline: auto;
      padding: 2rem 1.25rem 3rem;
    }

    /* ======================================================================
       Stage
       ====================================================================== */
    .stage {
      container-type: inline-size;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      text-align: center;
    }

    .stage :focus-visible {
      outline-color: var(--stage-fg);
    }

    .stage__status {
      min-height: 1.5em;
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      font-weight: 800;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
    }

    .clock {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(4.5rem, min(22vw, 42vh), 22rem); /* fallback without container units */
      /* Height cap keeps the buttons above the fold now that the stage is full width. */
      font-size: clamp(4.5rem, min(30cqi, 42vh), 22rem);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      white-space: nowrap;
    }

    body[data-zone="over"]:is([data-status="running"], [data-status="finished"]) .clock {
      animation: pulse 0.9s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      to {
        opacity: 0.45;
      }
    }

    .stage__meta {
      margin: 0;
      font-size: clamp(1.5rem, 2.5vw, 2rem);
    }

    .progress {
      width: 100%;
      height: clamp(1.5rem, 3.5vh, 2.25rem);
      overflow: hidden;
      border: 3px solid currentColor;
      border-radius: var(--radius);
      /* Tinted track so the remaining part is visible, not just an outline. */
      background-color: rgb(255 255 255 / 0.18); /* fallback */
      background-color: color-mix(in srgb, currentColor 22%, transparent);
    }

    .progress__bar {
      width: 100%;
      height: 100%;
      background-color: currentColor;
      transform: scaleX(0);
      transform-origin: left center;
    }

    /* Glide smoothly between whole seconds while running; snap on pause and reset. */
    body[data-status="running"] .progress__bar {
      transition: transform 1s linear;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 0.5rem;
      transition: opacity var(--speed);
    }

    /* Outline buttons that invert on hover, like the athene.fi navigation. */
    .btn {
      min-width: 9.5rem;
      padding: 0.75rem 1.5rem;
      border: 2px solid currentColor;
      border-radius: var(--radius);
      background-color: transparent;
      color: inherit;
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color var(--speed), color var(--speed);
    }

    .btn:hover {
      background-color: var(--stage-fg);
      color: var(--stage-bg);
    }

    .btn--primary {
      background-color: var(--stage-fg);
      color: var(--stage-bg);
    }

    .btn--primary:hover {
      background-color: transparent;
      color: var(--stage-fg);
    }

    /* ======================================================================
       Settings panel — paper card with green heading bands
       ====================================================================== */
    .panel {
      justify-self: center;
      width: min(100%, 64rem);
      padding: 0.25rem clamp(1.25rem, 3vw, 2rem) 1.5rem;
      background-color: var(--athene-paper);
      color: var(--athene-ink);
      box-shadow: 0 0 0 1px rgb(0 0 0 / 0.08);
    }

    .panel__heading {
      margin: 1rem 0;
      background-color: var(--athene-green);
      color: var(--athene-paper);
      font-family: var(--font-display);
      font-size: 1.1875rem;
      font-weight: 800;
      letter-spacing: var(--tracking);
      line-height: 3em;
      text-align: center;
      text-transform: uppercase;
    }

    .settings {
      display: grid;
      gap: 1.5rem;
    }

    .fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .label {
      display: block;
      margin-bottom: 0.375rem;
      padding: 0;
      color: var(--athene-green-deep);
      font-family: var(--font-display);
      font-size: 0.8125rem;
      font-weight: 800;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
    }

    .time-fields {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .time-fields__sep {
      padding-bottom: 0.5rem;
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
    }

    .field {
      display: flex;
      flex: 1 1 0;
      flex-direction: column;
      min-width: 0;
    }

    .input {
      width: 100%;
      min-height: 3.25rem;
      padding: 0.25rem 0.625rem;
      border: 2px solid var(--athene-green-deep);
      border-radius: var(--radius);
      background-color: #fff;
      color: var(--athene-ink);
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .input[aria-invalid="true"] {
      border-color: var(--alert-red);
    }

    .field-error {
      margin: 0.5rem 0 0;
      color: var(--alert-red);
    }

    .hint {
      margin: 0.375rem 0 0;
      font-size: 0.9375rem;
    }

    .chip {
      padding: 0.375rem 0.75rem;
      border: 2px solid var(--athene-green-deep);
      border-radius: var(--radius);
      background-color: transparent;
      color: var(--athene-green-deep);
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: var(--tracking);
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color var(--speed), color var(--speed);
    }

    .chip:hover,
    .chip[aria-pressed="true"],
    .chip--solid {
      background-color: var(--athene-green-deep);
      color: var(--athene-paper);
    }

    .chip--solid:hover {
      background-color: transparent;
      color: var(--athene-green-deep);
    }

    .chip--set {
      min-height: 3.25rem;
      padding-inline: 1rem;
    }

    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      font-size: 1.0625rem;
      cursor: pointer;
    }

    .check input {
      flex: none;
      width: 1.25rem;
      height: 1.25rem;
      margin: 0;
      accent-color: var(--athene-green-deep);
    }

    .checks {
      display: grid;
      gap: 0.75rem;
    }

    .shortcuts {
      display: grid;
      gap: 0.5rem;
      margin: 0;
    }

    .shortcuts__row {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .shortcuts dt {
      flex: 0 0 5rem;
    }

    .shortcuts dd {
      margin: 0;
    }

    /* Wider panel below the clock: settings in two columns, shortcuts in one row. */
    @media (min-width: 48rem) {
      .settings {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1.5rem 2.5rem;
        align-items: start;
      }

      .shortcuts {
        grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
        gap: 0.75rem 2.5rem;
      }
    }

    kbd {
      display: inline-block;
      min-width: 2.25rem;
      padding: 0.125rem 0.5rem;
      border: 2px solid var(--athene-green-deep);
      border-radius: var(--radius);
      color: var(--athene-green-deep);
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
    }

    .noscript {
      margin: 1.25rem;
      padding: 1rem;
      background-color: var(--athene-paper);
      color: var(--athene-ink);
      text-align: center;
    }

    /* ======================================================================
       Fullscreen presenter view: only the timer, controls fade when idle
       ====================================================================== */
    .is-presenting .site-header,
    .is-presenting .panel {
      display: none;
    }

    .is-presenting .layout {
      grid-template-columns: minmax(0, 1fr);
      align-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 2rem;
    }

    .is-presenting .clock {
      font-size: min(30cqi, 58vh);
    }

    .is-presenting .stage__status,
    .is-presenting .stage__meta {
      font-size: clamp(1.5rem, 3vw, 3rem);
    }

    .is-presenting .progress {
      height: clamp(2rem, 5vh, 3.5rem);
      border-width: 4px;
    }

    .is-presenting.is-pointer-idle {
      cursor: none;
    }

    .is-presenting.is-pointer-idle .controls:not(:focus-within) {
      opacity: 0;
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>

<body data-status="idle" data-zone="normal">
  <header class="site-header">
    <h1 class="site-header__title">Pitch Timer</h1>
    <hr class="site-header__rule">
  </header>

  <main class="layout">
    <section class="stage" aria-label="Timer">
      <p class="stage__status" id="status">Ready</p>
      <p class="clock" id="clock" role="timer" aria-atomic="true">0:00</p>
      <p class="stage__meta">
        Target <span id="target-label">3:00</span> · <span id="remaining">3:00 left</span>
      </p>
      <div
        class="progress"
        id="progress"
        role="progressbar"
        aria-label="Progress toward target"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress__bar" id="progress-bar"></div>
      </div>
      <div class="controls">
        <button type="button" class="btn btn--primary" id="toggle" aria-keyshortcuts="Space">Start</button>
        <button type="button" class="btn" id="reset" aria-keyshortcuts="R">Reset</button>
        <button type="button" class="btn" id="fullscreen" aria-keyshortcuts="F">Fullscreen</button>
      </div>
    </section>

    <section class="panel" aria-labelledby="settings-heading">
      <h2 class="panel__heading" id="settings-heading">Settings</h2>

      <form class="settings" id="settings-form" novalidate>
        <fieldset class="fieldset" id="target-fields">
          <legend class="label">Count to</legend>
          <div class="time-fields">
            <div class="field">
              <label class="label" for="target-minutes">Min</label>
              <input
                class="input"
                id="target-minutes"
                type="number"
                inputmode="numeric"
                min="0"
                max="99"
                step="1"
                aria-describedby="target-error"
              >
            </div>
            <span class="time-fields__sep" aria-hidden="true">:</span>
            <div class="field">
              <label class="label" for="target-seconds">Sec</label>
              <input
                class="input"
                id="target-seconds"
                type="number"
                inputmode="numeric"
                min="0"
                max="59"
                step="1"
                aria-describedby="target-error"
              >
            </div>
            <button type="submit" class="chip chip--solid chip--set">Set</button>
          </div>
          <p class="field-error" id="target-error" role="alert" hidden></p>
        </fieldset>

        <div role="group" aria-labelledby="presets-label">
          <span class="label" id="presets-label">Presets</span>
          <div class="presets" id="presets">
            <button type="button" class="chip" data-seconds="60" aria-pressed="false">1:00</button>
            <button type="button" class="chip" data-seconds="120" aria-pressed="false">2:00</button>
            <button type="button" class="chip" data-seconds="180" aria-pressed="false">3:00</button>
            <button type="button" class="chip" data-seconds="240" aria-pressed="false">4:00</button>
            <button type="button" class="chip" data-seconds="300" aria-pressed="false">5:00</button>
            <button type="button" class="chip" data-seconds="600" aria-pressed="false">10:00</button>
          </div>
        </div>

        <div class="field">
          <label class="label" for="warning-seconds">Wrap-up warning (seconds)</label>
          <input
            class="input"
            id="warning-seconds"
            type="number"
            inputmode="numeric"
            min="0"
            max="600"
            step="5"
            aria-describedby="warning-hint"
          >
          <p class="hint" id="warning-hint">The screen turns light when this much time is left. Use 0 to turn it off.</p>
        </div>

        <div class="checks">
          <label class="check">
            <input type="checkbox" id="overtime">
            Keep counting past the target
          </label>
          <label class="check">
            <input type="checkbox" id="sound">
            Sound cues (beep at warning and at time)
          </label>
        </div>
      </form>

      <h2 class="panel__heading">Keyboard</h2>
      <dl class="shortcuts">
        <div class="shortcuts__row">
          <dt><kbd>Space</kbd></dt>
          <dd>Start / pause</dd>
        </div>
        <div class="shortcuts__row">
          <dt><kbd>R</kbd></dt>
          <dd>Reset to 0:00</dd>
        </div>
        <div class="shortcuts__row" data-requires="fullscreen">
          <dt><kbd>F</kbd></dt>
          <dd>Fullscreen on / off</dd>
        </div>
      </dl>
    </section>
  </main>

  <p class="visually-hidden" id="announcer" aria-live="polite"></p>

  <noscript>
    <p class="noscript">This timer needs JavaScript. Please enable it and reload the page.</p>
  </noscript>

  <script type="module">
    // =========================================================================
    // Configuration
    // =========================================================================
    const STORAGE_KEY = "pitch-timer.settings.v1";
    const TICK_SLACK_MS = 5; // wake just after each whole second
    const POINTER_IDLE_MS = 2500; // hide controls in fullscreen after this much mouse stillness
    const ANNOUNCE_DELAY_MS = 50;

    const LIMITS = Object.freeze({
      minTargetSeconds: 1,
      maxTargetSeconds: 99 * 60 + 59,
      maxWarningSeconds: 10 * 60,
    });

    const DEFAULT_SETTINGS = Object.freeze({
      targetSeconds: 3 * 60,
      warningSeconds: 30,
      overtime: false,
      sound: false,
    });

    const CUES = Object.freeze({
      warning: [{ frequency: 880, duration: 0.18, gap: 0 }],
      end: [
        { frequency: 880, duration: 0.22, gap: 0.12 },
        { frequency: 880, duration: 0.22, gap: 0.12 },
        { frequency: 660, duration: 0.6, gap: 0 },
      ],
    });

    const TOGGLE_LABELS = Object.freeze({
      idle: "Start",
      running: "Pause",
      paused: "Resume",
      finished: "Restart",
    });

    // =========================================================================
    // Pure helpers (no DOM access)
    // =========================================================================

    /** Coerces a value to an integer within [min, max], or returns the fallback. */
    function clampInt(value, min, max, fallback) {
      const number = typeof value === "number" ? value : Number.parseInt(String(value), 10);
      if (!Number.isFinite(number)) return fallback;
      return Math.min(max, Math.max(min, Math.trunc(number)));
    }

    /** 185 → "3:05" */
    function formatClock(totalSeconds) {
      const safe = Math.max(0, Math.trunc(totalSeconds));
      const minutes = Math.floor(safe / 60);
      const seconds = safe % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    /** 185 → "3 minutes 5 seconds" (for screen-reader announcements) */
    function formatSpoken(totalSeconds) {
      const safe = Math.max(0, Math.trunc(totalSeconds));
      const minutes = Math.floor(safe / 60);
      const seconds = safe % 60;
      const parts = [];
      if (minutes > 0) parts.push(`${minutes} ${minutes === 1 ? "minute" : "minutes"}`);
      if (seconds > 0 || minutes === 0) parts.push(`${seconds} ${seconds === 1 ? "second" : "seconds"}`);
      return parts.join(" ");
    }

    /** Returns "normal", "warning" or "over" for the given elapsed time. */
    function getZone(elapsedMs, { targetSeconds, warningSeconds }) {
      const remainingMs = targetSeconds * 1000 - elapsedMs;
      if (remainingMs <= 0) return "over";
      if (elapsedMs > 0 && remainingMs <= warningSeconds * 1000) return "warning";
      return "normal";
    }

    function statusLabel(status, zone) {
      if (status === "idle") return "Ready";
      if (status === "paused") return "Paused";
      if (zone === "over") return "Time’s up";
      if (zone === "warning") return "Wrap up";
      return "Running";
    }

    /** Validates settings from any source (storage, form) and fills gaps with defaults. */
    function sanitizeSettings(raw) {
      const source = raw && typeof raw === "object" ? raw : {};
      return {
        targetSeconds: clampInt(
          source.targetSeconds,
          LIMITS.minTargetSeconds,
          LIMITS.maxTargetSeconds,
          DEFAULT_SETTINGS.targetSeconds,
        ),
        warningSeconds: clampInt(
          source.warningSeconds,
          0,
          LIMITS.maxWarningSeconds,
          DEFAULT_SETTINGS.warningSeconds,
        ),
        overtime: typeof source.overtime === "boolean" ? source.overtime : DEFAULT_SETTINGS.overtime,
        sound: typeof source.sound === "boolean" ? source.sound : DEFAULT_SETTINGS.sound,
      };
    }

    // =========================================================================
    // Services
    // =========================================================================

    /**
     * Drift-free stopwatch. Elapsed time is computed from a monotonic clock
     * (performance.now) instead of counting ticks, so throttled or late timers
     * never make it lose time.
     */
    function createStopwatch(now = () => performance.now()) {
      let accumulatedMs = 0;
      let startedAt = null;

      return {
        isRunning: () => startedAt !== null,
        elapsed: () => accumulatedMs + (startedAt === null ? 0 : now() - startedAt),
        start() {
          if (startedAt === null) startedAt = now();
        },
        pause() {
          if (startedAt === null) return;
          accumulatedMs += now() - startedAt;
          startedAt = null;
        },
        stopAt(ms) {
          startedAt = null;
          accumulatedMs = ms;
        },
        reset() {
          startedAt = null;
          accumulatedMs = 0;
        },
      };
    }

    /** Persists settings in localStorage; degrades silently if storage is unavailable. */
    function createSettingsStore(key) {
      const getStorage = () => {
        try {
          return window.localStorage;
        } catch {
          return null;
        }
      };

      return {
        load() {
          try {
            const raw = getStorage()?.getItem(key);
            return sanitizeSettings(raw ? JSON.parse(raw) : null);
          } catch {
            return { ...DEFAULT_SETTINGS };
          }
        },
        save(settings) {
          try {
            getStorage()?.setItem(key, JSON.stringify(settings));
          } catch {
            // Storage full or blocked: settings just won't survive a reload.
          }
        },
      };
    }

    /** Short synthesized beeps; no audio files needed. */
    function createBeeper() {
      let context = null;

      return {
        /** Call from a click or key press: browsers only allow audio after a user gesture. */
        unlock() {
          const AudioContextClass = window.AudioContext ?? window.webkitAudioContext;
          if (!AudioContextClass) return;
          context ??= new AudioContextClass();
          if (context.state === "suspended") context.resume().catch(() => {});
        },
        play(pattern) {
          if (!context) return;
          if (context.state === "suspended") context.resume().catch(() => {});
          let at = context.currentTime + 0.02;
          for (const { frequency, duration, gap } of pattern) {
            const oscillator = context.createOscillator();
            const gain = context.createGain();
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(frequency, at);
            gain.gain.setValueAtTime(0.0001, at);
            gain.gain.exponentialRampToValueAtTime(0.35, at + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
            oscillator.connect(gain).connect(context.destination);
            oscillator.start(at);
            oscillator.stop(at + duration + 0.05);
            at += duration + gap;
          }
        },
      };
    }

    /** Keeps the screen awake while wanted (Screen Wake Lock API, where available). */
    function createWakeLock() {
      let sentinel = null;
      let pending = false;
      let wanted = false;

      async function request() {
        if (!("wakeLock" in navigator) || sentinel || pending) return;
        if (document.visibilityState !== "visible") return;
        pending = true;
        try {
          const lock = await navigator.wakeLock.request("screen");
          if (!wanted) {
            await lock.release();
            return;
          }
          sentinel = lock;
          lock.addEventListener("release", () => {
            if (sentinel === lock) sentinel = null;
          });
        } catch {
          // Refused (e.g. battery saver). The timer works fine without it.
        } finally {
          pending = false;
        }
      }

      return {
        hold(shouldHold) {
          wanted = shouldHold;
          if (shouldHold) {
            request();
          } else if (sentinel) {
            const lock = sentinel;
            sentinel = null;
            lock.release().catch(() => {});
          }
        },
      };
    }

    const fullscreen = {
      supported: Boolean(document.fullscreenEnabled && document.documentElement.requestFullscreen),
      isActive: () => Boolean(document.fullscreenElement),
      async toggle() {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else {
            await document.documentElement.requestFullscreen({ navigationUI: "hide" });
          }
        } catch (error) {
          console.warn("Fullscreen request failed:", error);
        }
      },
    };

    // =========================================================================
    // DOM references
    // =========================================================================
    function byId(id) {
      const element = document.getElementById(id);
      if (!element) throw new Error(`Pitch timer: missing element #${id}`);
      return element;
    }

    const els = {
      body: document.body,
      status: byId("status"),
      clock: byId("clock"),
      targetLabel: byId("target-label"),
      remaining: byId("remaining"),
      progress: byId("progress"),
      progressBar: byId("progress-bar"),
      toggle: byId("toggle"),
      reset: byId("reset"),
      fullscreen: byId("fullscreen"),
      form: byId("settings-form"),
      targetFields: byId("target-fields"),
      minutes: byId("target-minutes"),
      seconds: byId("target-seconds"),
      targetError: byId("target-error"),
      presets: byId("presets"),
      warning: byId("warning-seconds"),
      overtime: byId("overtime"),
      sound: byId("sound"),
      announcer: byId("announcer"),
    };

    // =========================================================================
    // State
    // =========================================================================
    const store = createSettingsStore(STORAGE_KEY);
    const stopwatch = createStopwatch();
    const beeper = createBeeper();
    const wakeLock = createWakeLock();

    let settings = store.load();
    /** status: "idle" | "running" | "paused" | "finished"; zone: "normal" | "warning" | "over" */
    const state = { status: "idle", zone: "normal" };
    let tickTimer = 0;
    let pointerTimer = 0;
    let announceTimer = 0;

    // =========================================================================
    // Rendering
    // =========================================================================
    function setText(element, text) {
      if (element.textContent !== text) element.textContent = text;
    }

    function render(elapsedMs) {
      const { targetSeconds } = settings;
      const elapsedSeconds = Math.floor(elapsedMs / 1000);
      const remainingMs = targetSeconds * 1000 - elapsedMs;
      const clockText = formatClock(elapsedSeconds);

      let remainingText = "0:00 left";
      if (remainingMs > 0) {
        remainingText = `${formatClock(Math.ceil(remainingMs / 1000))} left`;
      } else if (elapsedSeconds > targetSeconds) {
        remainingText = `+${formatClock(elapsedSeconds - targetSeconds)} over`;
      }

      const fraction = Math.min(1, elapsedSeconds / targetSeconds);

      els.body.dataset.status = state.status;
      els.body.dataset.zone = state.zone;
      setText(els.status, statusLabel(state.status, state.zone));
      setText(els.clock, clockText);
      setText(els.targetLabel, formatClock(targetSeconds));
      setText(els.remaining, remainingText);
      setText(els.toggle, TOGGLE_LABELS[state.status]);
      els.progressBar.style.transform = `scaleX(${fraction})`;
      els.progress.setAttribute("aria-valuenow", String(Math.round(fraction * 100)));
      els.progress.setAttribute("aria-valuetext", `${clockText} of ${formatClock(targetSeconds)}`);
      document.title = `${clockText} · Pitch Timer`;
    }

    function syncForm() {
      const { targetSeconds, warningSeconds, overtime, sound } = settings;
      clearTargetError();
      els.minutes.value = String(Math.floor(targetSeconds / 60));
      els.seconds.value = String(targetSeconds % 60).padStart(2, "0");
      els.warning.value = String(warningSeconds);
      els.overtime.checked = overtime;
      els.sound.checked = sound;
      for (const chip of els.presets.querySelectorAll("button[data-seconds]")) {
        chip.setAttribute("aria-pressed", String(Number(chip.dataset.seconds) === targetSeconds));
      }
    }

    function announce(message) {
      // Clear first so repeating the same message is still announced.
      els.announcer.textContent = "";
      window.clearTimeout(announceTimer);
      announceTimer = window.setTimeout(() => {
        els.announcer.textContent = message;
      }, ANNOUNCE_DELAY_MS);
    }

    function showTargetError(message) {
      els.targetError.textContent = message;
      els.targetError.hidden = false;
      els.minutes.setAttribute("aria-invalid", "true");
      els.seconds.setAttribute("aria-invalid", "true");
    }

    function clearTargetError() {
      els.targetError.hidden = true;
      els.targetError.textContent = "";
      els.minutes.removeAttribute("aria-invalid");
      els.seconds.removeAttribute("aria-invalid");
    }

    // =========================================================================
    // Core loop
    // =========================================================================
    function onZoneEntered(zone, remainingMs) {
      if (zone === "warning") {
        announce(`${formatSpoken(Math.ceil(remainingMs / 1000))} left`);
        if (settings.sound) beeper.play(CUES.warning);
      } else if (zone === "over") {
        announce("Time’s up");
        if (settings.sound) beeper.play(CUES.end);
      }
    }

    function scheduleNextTick(elapsedMs) {
      window.clearTimeout(tickTimer);
      if (!stopwatch.isRunning()) return;
      const untilNextSecond = 1000 - (elapsedMs % 1000);
      tickTimer = window.setTimeout(update, untilNextSecond + TICK_SLACK_MS);
    }

    /** Single place where state is reconciled with the clock and the screen is redrawn. */
    function update() {
      const wasRunning = stopwatch.isRunning();
      const targetMs = settings.targetSeconds * 1000;
      let elapsedMs = stopwatch.elapsed();

      if (
        !settings.overtime &&
        elapsedMs >= targetMs &&
        (state.status === "running" || state.status === "paused")
      ) {
        // Reached the target: stop exactly on it.
        stopwatch.stopAt(targetMs);
        elapsedMs = targetMs;
        state.status = "finished";
      } else if (state.status === "finished" && (settings.overtime || elapsedMs < targetMs)) {
        // Target was raised or overtime switched on after time ran out: allow resuming.
        state.status = "paused";
      }

      const zone = getZone(elapsedMs, settings);
      if (zone !== state.zone) {
        state.zone = zone;
        if (wasRunning) onZoneEntered(zone, targetMs - elapsedMs);
      }

      render(elapsedMs);
      scheduleNextTick(elapsedMs);
      wakeLock.hold(stopwatch.isRunning() || fullscreen.isActive());
    }

    // =========================================================================
    // Actions
    // =========================================================================
    function start() {
      if (state.status === "running") return;
      if (state.status === "finished") stopwatch.reset();
      if (settings.sound) beeper.unlock();
      stopwatch.start();
      state.status = "running";
      announce("Started");
      update();
    }

    function pause() {
      if (state.status !== "running") return;
      stopwatch.pause();
      state.status = "paused";
      announce(`Paused at ${formatSpoken(Math.floor(stopwatch.elapsed() / 1000))}`);
      update();
    }

    function toggle() {
      if (state.status === "running") {
        pause();
      } else {
        start();
      }
    }

    function reset() {
      stopwatch.reset();
      state.status = "idle";
      announce("Reset to zero");
      update();
    }

    function updateSettings(patch) {
      settings = sanitizeSettings({ ...settings, ...patch });
      store.save(settings);
      syncForm();
      update();
    }

    /** Reads a non-negative whole number from a number input; empty counts as 0. */
    function readWholeNumber(input) {
      if (input.validity.badInput) return null;
      if (input.value.trim() === "") return 0;
      const number = input.valueAsNumber;
      return Number.isInteger(number) && number >= 0 ? number : null;
    }

    function applyTargetFromInputs() {
      const minutes = readWholeNumber(els.minutes);
      const seconds = readWholeNumber(els.seconds);
      if (minutes === null || seconds === null) {
        showTargetError("Use whole numbers, for example 3 min 0 sec.");
        return;
      }
      const total = minutes * 60 + seconds; // 90 sec is accepted and shown as 1:30
      if (total < LIMITS.minTargetSeconds) {
        showTargetError("Set a target of at least 1 second.");
        return;
      }
      updateSettings({ targetSeconds: Math.min(total, LIMITS.maxTargetSeconds) });
    }

    function applyWarningFromInput() {
      updateSettings({
        warningSeconds: clampInt(els.warning.value, 0, LIMITS.maxWarningSeconds, settings.warningSeconds),
      });
    }

    function wakePointer() {
      els.body.classList.remove("is-pointer-idle");
      window.clearTimeout(pointerTimer);
      if (fullscreen.isActive()) {
        pointerTimer = window.setTimeout(() => els.body.classList.add("is-pointer-idle"), POINTER_IDLE_MS);
      }
    }

    /** True for fields where typed characters are text, so shortcuts must not fire. */
    function isTextEntry(target) {
      if (!(target instanceof Element)) return false;
      if (target.closest("textarea, select, [contenteditable]:not([contenteditable='false'])")) return true;
      const nonTextTypes = ["checkbox", "radio", "button", "submit", "reset"];
      return target instanceof HTMLInputElement && !nonTextTypes.includes(target.type);
    }

    function onKeyDown(event) {
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
      if (isTextEntry(event.target)) return;
      const onControl = event.target instanceof Element && event.target.closest("button, input");

      switch (event.key) {
        case " ":
          if (onControl) return; // a focused button or checkbox handles Space itself
          event.preventDefault(); // don't scroll the page
          if (!event.repeat) toggle();
          break;
        case "r":
        case "R":
          if (!event.repeat) reset();
          break;
        case "f":
        case "F":
          if (fullscreen.supported && !event.repeat) fullscreen.toggle();
          break;
        default:
          break;
      }
    }

    // =========================================================================
    // Event wiring
    // =========================================================================
    els.toggle.addEventListener("click", toggle);
    els.reset.addEventListener("click", reset);
    els.fullscreen.addEventListener("click", () => fullscreen.toggle());

    els.form.addEventListener("submit", (event) => {
      event.preventDefault();
      applyTargetFromInputs();
      applyWarningFromInput();
      if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
    });
    // Apply minutes + seconds together once focus leaves the pair. Applying each
    // field on its own would briefly set half-edited targets (3:00 → 2:00 → 2:30),
    // which could end a running pitch early.
    els.targetFields.addEventListener("focusout", (event) => {
      if (!els.targetFields.contains(event.relatedTarget)) applyTargetFromInputs();
    });
    els.warning.addEventListener("change", applyWarningFromInput);
    els.overtime.addEventListener("change", () => updateSettings({ overtime: els.overtime.checked }));
    els.sound.addEventListener("change", () => {
      updateSettings({ sound: els.sound.checked });
      if (els.sound.checked) {
        beeper.unlock();
        beeper.play(CUES.warning); // lets the operator check the volume
      }
    });

    els.presets.addEventListener("click", (event) => {
      const chip = event.target instanceof Element ? event.target.closest("button[data-seconds]") : null;
      if (chip) updateSettings({ targetSeconds: Number(chip.dataset.seconds) });
    });

    document.addEventListener("keydown", onKeyDown);

    // A mouse click leaves focus on the clicked control, so the next Space press
    // would trigger that control instead of start/pause. Keyboard-initiated
    // clicks (detail === 0) keep their focus for accessibility.
    document.addEventListener("click", (event) => {
      if (event.detail === 0) return;
      window.setTimeout(() => {
        const active = document.activeElement;
        const isButton = active instanceof HTMLButtonElement;
        const isCheckbox = active instanceof HTMLInputElement && active.type === "checkbox";
        if (isButton || isCheckbox) active.blur();
      }, 0);
    });

    document.addEventListener("fullscreenchange", () => {
      const active = fullscreen.isActive();
      els.body.classList.toggle("is-presenting", active);
      setText(els.fullscreen, active ? "Exit fullscreen" : "Fullscreen");
      if (active) {
        wakePointer();
      } else {
        window.clearTimeout(pointerTimer);
        els.body.classList.remove("is-pointer-idle");
      }
      update();
    });
    document.addEventListener("pointermove", wakePointer, { passive: true });
    document.addEventListener("focusin", wakePointer);

    // Timers are throttled in background tabs; resync as soon as the page is visible.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") update();
    });

    // Guard against closing or reloading the tab in the middle of a pitch.
    window.addEventListener("beforeunload", (event) => {
      if (!stopwatch.isRunning()) return;
      event.preventDefault();
      event.returnValue = "";
    });

    // =========================================================================
    // Init
    // =========================================================================
    if (!fullscreen.supported) {
      els.fullscreen.hidden = true;
      for (const row of document.querySelectorAll('[data-requires="fullscreen"]')) row.hidden = true;
    }
    syncForm();
    update();
  </script>
</body>
</html>
